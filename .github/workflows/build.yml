name: Build APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ============================================================
  # Guard changelog: setiap perubahan app/src wajib ada entry CHANGELOG.md
  # ============================================================
  check-changelog:
    name: Guard Changelog
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cek perubahan app/src wajib ada CHANGELOG.md
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED_APP=$(git diff --name-only "$BASE"...HEAD -- app/src | head -n1)
          CHANGED_LOG=$(git diff --name-only "$BASE"...HEAD -- CHANGELOG.md | head -n1)
          if [ -n "$CHANGED_APP" ] && [ -z "$CHANGED_LOG" ]; then
            echo "::error::Perubahan app/src terdeteksi tapi CHANGELOG.md tidak diubah."
            exit 1
          fi
          echo "Guard changelog OK."

  # ============================================================
  # Build utama
  # ============================================================
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # Secret keystore diangkat ke env job-level agar bisa dicek & dipakai step.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Rekonstruksi keystore release dari secret (jika tersedia)
        shell: bash
        run: |
          if [ "${HAS_KEYSTORE}" = "true" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "Keystore release tersedia."
          else
            echo "Secret KEYSTORE_BASE64 belum diset — build release akan dilewati."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: "Bump versionCode dari run number (pola Tasirin: 100000 + run_number)"
        id: vc
        run: |
          echo "VERSION_CODE=$((100000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Run lint (abortOnError)
        run: ./gradlew lintDebug

      - name: Run unit test
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionCodeOverride=$VERSION_CODE

      - name: Build Release APK (jika keystore tersedia)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionCodeOverride=$VERSION_CODE

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload mapping.txt (deobfuscation)
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Publish APK ke GitHub Releases (hanya push ke main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VERSION_CODE }}
          name: CineFlow build-${{ env.VERSION_CODE }}
          body: |
            APK resmi dihasilkan otomatis oleh CI (build #${{ github.run_number }}).

            - `cineflow-debug.apk` — untuk tes/install manual
            - `cineflow-release.apk` — ditandatangani keystore resmi
            - `mapping.txt` — deobfuscation R8
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: false

      - name: VirusTotal submit (jika API key tersedia)
        id: vt-submit
        # Jalan juga di PR (repositori sama): APK yang mau di-merge ikut di-scan.
        if: env.VT_API_KEY != ''
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [ -f app/build/outputs/apk/release/app-release.apk ] && APK="app/build/outputs/apk/release/app-release.apk"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "Mengunggah $APK ke VirusTotal..."
          echo "SHA-256: $SHA"
          RESP=$(curl -s --max-time 120 -H "x-apikey: $VT_API_KEY" \
            --form "file=@$APK" https://www.virustotal.com/api/v3/files)
          ID=$(echo "$RESP" | jq -r '.data.id // empty')
          if [ -z "$ID" ]; then
            echo "::warning::VirusTotal menolak upload: $(echo "$RESP" | jq -c '.error // .' | head -c 300)"
          else
            echo "VirusTotal analysis id: $ID"
            echo "VirusTotal report: https://www.virustotal.com/gui/file/$SHA"
            echo "id=$ID" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: VirusTotal tunggu hasil & ringkasan
        if: steps.vt-submit.outputs.id != ''
        run: |
          ID="${{ steps.vt-submit.outputs.id }}"
          SHA="${{ steps.vt-submit.outputs.sha }}"
          STATUS="queued"
          TRIES=0
          while [ "$STATUS" = "queued" ] || [ "$STATUS" = "in-progress" ]; do
            TRIES=$((TRIES + 1))
            if [ "$TRIES" -gt 30 ]; then
              echo "::warning::VirusTotal belum selesai setelah ~10 menit — cek manual: https://www.virustotal.com/gui/file/$SHA"
              exit 0
            fi
            sleep 20
            RESP=$(curl -s --max-time 60 -H "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/analyses/$ID")
            STATUS=$(echo "$RESP" | jq -r '.data.attributes.status // "queued"')
          done
          echo "Status analisis: $STATUS"
          if [ "$STATUS" != "completed" ]; then
            echo "::warning::Analisis VirusTotal selesai dengan status '$STATUS' — cek manual: https://www.virustotal.com/gui/file/$SHA"
            exit 0
          fi
          STATS=$(echo "$RESP" | jq -c '.data.attributes.stats // {}')
          MALICIOUS=$(echo "$STATS" | jq -r '.malicious // 0')
          SUSPICIOUS=$(echo "$STATS" | jq -r '.suspicious // 0')
          TOTAL=$(echo "$STATS" | jq '[.[] | numbers] | add // 0')
          echo "VirusTotal: $MALICIOUS dari $TOTAL engine mendeteksi malware"
          echo "  malicious: $MALICIOUS | suspicious: $SUSPICIOUS | total: $TOTAL"
          if [ "$MALICIOUS" -gt 0 ] || [ "$SUSPICIOUS" -gt 0 ]; then
            echo "::warning::VirusTotal melaporkan $MALICIOUS malicious / $SUSPICIOUS suspicious — cek https://www.virustotal.com/gui/file/$SHA"
            echo "$RESP" | jq -r '.data.attributes.results // {} | to_entries[] | select(.value.category == "malicious" or .value.category == "suspicious") | "  - \(.key): \(.value.result // .value.category)"'
          else
            echo "VirusTotal: bersih (tidak ada deteksi)"
          fi
          {
            echo "### VirusTotal"
            echo ""
            echo "- Status: **completed**"
            echo "- Deteksi: **$MALICIOUS/$TOTAL** engine"
            echo "- Report: https://www.virustotal.com/gui/file/$SHA"
          } >> "$GITHUB_STEP_SUMMARY"
