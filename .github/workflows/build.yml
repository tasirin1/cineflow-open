name: Build APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ============================================================
  # Guard changelog: setiap perubahan app/src wajib ada entry CHANGELOG.md
  # ============================================================
  check-changelog:
    name: Guard Changelog
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cek perubahan app/src wajib ada CHANGELOG.md
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED_APP=$(git diff --name-only "$BASE"...HEAD -- app/src | head -n1)
          CHANGED_LOG=$(git diff --name-only "$BASE"...HEAD -- CHANGELOG.md | head -n1)
          if [ -n "$CHANGED_APP" ] && [ -z "$CHANGED_LOG" ]; then
            echo "::error::Perubahan app/src terdeteksi tapi CHANGELOG.md tidak diubah."
            exit 1
          fi
          echo "Guard changelog OK."

  # ============================================================
  # Build utama
  # ============================================================
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # Secret keystore diangkat ke env job-level agar bisa dicek & dipakai step.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Rekonstruksi keystore release dari secret (jika tersedia)
        shell: bash
        run: |
          if [ "${HAS_KEYSTORE}" = "true" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "Keystore release tersedia."
          else
            echo "Secret KEYSTORE_BASE64 belum diset — build release akan dilewati."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: "Bump versionCode dari run number (pola Tasirin: 100000 + run_number)"
        id: vc
        run: |
          echo "VERSION_CODE=$((100000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Run lint (abortOnError)
        run: ./gradlew lintDebug

      - name: Run unit test
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionCodeOverride=$VERSION_CODE

      - name: Build Release APK (jika keystore tersedia)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionCodeOverride=$VERSION_CODE

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload mapping.txt (deobfuscation)
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
